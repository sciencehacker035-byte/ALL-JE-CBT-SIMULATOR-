// These are configurable placeholders. Verify current official notifications.

const ALL_EXAMS = Object.keys(EXAMS);
const T = "Technical", N = "Non-Technical";

function q(id,section,subject,topic,difficulty,question,options,answer,explanation,formula=""){

    id, exam:ALL_EXAMS, section, subject, topic, difficulty,
    question, options, correctAnswer:answer, explanation,
    concept:topic, formula, sourceType:"PYQ-style / Practice Question",
    year:null, tags:[subject,topic]

}

/* =========================================================
   STATE / HELPERS
   ========================================================= */
const app = document.getElementById("app");
let timer = null;

const defaultState = {
  version:2, attempts:{}, history:[], bookmarks:[],
  active:null, theme:"light", exam:"RRB_JE"
};

let P = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return structuredClone(defaultState);
    const parsed = JSON.parse(raw);
    return {...structuredClone(defaultState), ...parsed};
  }catch(e){
    return structuredClone(defaultState);
  }
}
function save(){ localStorage.setItem(STORE, JSON.stringify(P)); }
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function shuffle(a){
  const x = a.slice();
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}
function pct(a,b){return b?Math.round(a/b*100):0;}
function stat(label,value){
  return `<div class="stat"><small>${esc(label)}</small><b>${esc(value)}</b></div>`;
}
function getQ(id){return QUESTIONS.find(x=>x.id===id);}
function att(id){return P.attempts[id];}
function due(id){
  const r=att(id);
  return !!r && r.wrong>0 && r.streak<MASTERY_THRESHOLD;
}
function mastered(id){
  const r=att(id);
  return !!r && r.wrong>0 && r.streak>=MASTERY_THRESHOLD;
}
function priority(r){
  if(!r || !r.wrong) return 0;
  if(r.streak>=MASTERY_THRESHOLD) return 1;
  const days=Math.min(14,(Date.now()-r.last)/86400000);
  return Math.min(100,r.wrong*20+(100-r.mastery)*.4+days*2+(r.lastResult==="W"?20:0));
}
function record(id,correct){
  const r=P.attempts[id] || {
    attempts:0,correct:0,wrong:0,streak:0,mastery:0,last:0,lastResult:""
  };
  r.attempts++;
  if(correct){r.correct++;r.streak++;}
  else {r.wrong++;r.streak=0;}
  r.mastery=Math.min(100,Math.round(r.correct/r.attempts*100));
  r.last=Date.now();
  r.lastResult=correct?"C":"W";
  P.attempts[id]=r;
}
function topicStats(){
  const out={};
  Object.entries(P.attempts).forEach(([id,r])=>{
    const x=getQ(id); if(!x) return;
    const k=x.subject+"||"+x.topic;
    out[k] ||= {subject:x.subject,topic:x.topic,a:0,c:0};
    out[k].a += r.attempts;
    out[k].c += r.correct;
  });
  return Object.values(out);
}
function weakTopics(){
  return topicStats().filter(x=>x.a>=2 && pct(x.c,x.a)<WEAK_BELOW);
}
function overall(){
  let solved=0,correct=0;
  Object.values(P.attempts).forEach(r=>{solved+=r.attempts;correct+=r.correct;});
  const scores=P.history.map(h=>h.percent||0);
  return {
    solved,accuracy:pct(correct,solved),tests:P.history.length,
    best:scores.length?Math.max(...scores):0,
    wrong:Object.values(P.attempts).filter(r=>r.wrong>0).length,
    due:Object.keys(P.attempts).filter(due).length,
    mastered:Object.keys(P.attempts).filter(mastered).length
  };
}
function clearTimer(){
  if(timer){clearInterval(timer);timer=null;}
}
function render(html){
  clearTimer();
  app.innerHTML=html;
  window.scrollTo(0,0);
}
function errorScreen(e){
  render(`<section class="card err">
    <h2>Application error</h2>
    <p>The simulator could not complete this action.</p>
    <pre>${esc(e?.stack || e)}</pre>
    <button class="btn pri" data-a="home">Return Home</button>
  </section>`);
}

/* =========================================================
   TEST SETUP
   ========================================================= */
function setup(defaultExam=P.exam){
  P.exam=defaultExam; save();
  render(`
  <section class="card">
    <h2>Configure Test</h2>
    <div class="form">
      <label>Exam
        <select id="exam">
          ${Object.entries(EXAMS).map(([k,e])=>`<option value="${k}" ${k===defaultExam?"selected":""}>${esc(e.name)}</option>`).join("")}
        </select>
      </label>
      <label>Section
        <select id="section">
          <option value="">Technical + Non-Technical</option>
          <option value="Technical">Technical</option>
          <option value="Non-Technical">Non-Technical</option>
        </select>
      </label>
      <label>Subject
        <select id="subject"><option value="">All Subjects</option></select>
      </label>
      <label>Difficulty
        <select id="difficulty">
          <option>Mixed</option><option>Easy</option><option>Medium</option><option>Hard</option>
        </select>
      </label>
      <label>Questions
        <select id="count"><option>10</option><option>20</option><option>25</option><option>50</option><option>100</option></select>
      </label>
      <label>Duration
        <select id="duration"><option value="auto">Exam proportion</option><option>10</option><option>20</option><option>30</option><option>60</option><option>120</option></select>
      </label>
    </div>
    <div class="actions">
      <button class="btn pri" data-a="startCustom">Start CBT</button>
      <button class="btn" data-a="home">Cancel</button>
    </div>
  </section>`);
  updateSubjects();
  document.getElementById("section").addEventListener("change",updateSubjects);
}
function updateSubjects(){
  const section=document.getElementById("section");
  const subject=document.getElementById("subject");
  if(!section||!subject)return;
  const list=section.value ? SUBJECTS[section.value] : [...new Set(Object.values(SUBJECTS).flat())];
  subject.innerHTML='<option value="">All Subjects</option>'+list.map(s=>`<option>${esc(s)}</option>`).join("");
}
function startCustom(){
  const exam=document.getElementById("exam").value;
  const section=document.getElementById("section").value;
  const subject=document.getElementById("subject").value;
  const difficulty=document.getElementById("difficulty").value;
  const count=Number(document.getElementById("count").value);
  const durationValue=document.getElementById("duration").value;
  const cfg=EXAMS[exam];
  const duration=durationValue==="auto"
    ? Math.max(1,Math.round(cfg.duration*count/cfg.total))
    : Number(durationValue);

  startTest({exam,section,subject,difficulty,count,duration,mode:"normal"});
}

/* =========================================================
   TEST BUILDER / REVISION
   ========================================================= */
function buildQuestions(o){
  if(Array.isArray(o.ids)&&o.ids.length){
    return o.ids.map(id=>getQ(id)).filter(Boolean).slice(0,o.count||o.ids.length);
  }
  let pool=QUESTIONS.filter(x=>x.exam.includes(o.exam));
  if(o.section)pool=pool.filter(x=>x.section===o.section);
  if(o.subject)pool=pool.filter(x=>x.subject===o.subject);
  if(o.difficulty && o.difficulty!=="Mixed")pool=pool.filter(x=>x.difficulty===o.difficulty);
  if(o.mode==="wrong")pool=pool.filter(x=>att(x.id)?.wrong>0);
  if(o.mode==="due")pool=pool.filter(x=>due(x.id));
  if(o.mode==="weak"){
    const wt=new Set(weakTopics().map(x=>x.topic));
    pool=pool.filter(x=>wt.has(x.topic));
  }
  if(o.mode==="bookmarks")pool=pool.filter(x=>P.bookmarks.includes(x.id));

  const count=Math.min(o.count||10,pool.length);
  if(!count)return [];

  const ranked=pool.map(x=>{
    const r=att(x.id);
    const w=r?priority(r):1;
    return {x,score:w+Math.random()};
  }).sort((a,b)=>b.score-a.score).map(z=>z.x);

  if(["wrong","due","weak","bookmarks"].includes(o.mode)) return shuffle(ranked.slice(0,count));

  const dueQs=ranked.filter(x=>due(x.id)).slice(0,Math.ceil(count*DUE_SHARE));
  const rest=shuffle(ranked.filter(x=>!dueQs.includes(x)));
  return shuffle([...dueQs,...rest.slice(0,count-dueQs.length)]);
}

function startTest(o){
  const qs=buildQuestions(o);
  if(!qs.length){alert("No questions match these settings yet.");return;}

  const cfg=EXAMS[o.exam];
  const duration=o.duration||Math.max(1,Math.round(cfg.duration*qs.length/cfg.total));
  const perm={};
  qs.forEach(x=>perm[x.id]=shuffle([0,1,2,3]));

  P.active={
    exam:o.exam,
    name:o.name || (o.mode==="wrong"?"My Mistakes":o.mode==="due"?"Revision Test":"CBT Practice"),
    ids:qs.map(x=>x.id),
    perm, answers:{}, state:{}, current:0,
    end:Date.now()+duration*60000,
    duration, score:{correct:cfg.correct,negative:cfg.negative}
  };
  P.exam=o.exam;
  save();
  examView();
}

/* =========================================================
   EXAM ENGINE
   ========================================================= */
function paletteClass(id,i){
  const A=P.active, st=A.state[id]||{}, answered=A.answers[id]!==undefined;
  return [
    i===A.current?"cur":"",
    answered && st.review?"ar":"",
    answered?"a":"",
    !answered && st.review?"r":"",
    !answered && st.visited?"na":""
  ].filter(Boolean).join(" ");
}
function examView(){
  const A=P.active;
  if(!A)return home();
  const id=A.ids[A.current], x=getQ(id);
  if(!x){P.active=null;save();return home();}
  const st=A.state[id] ||= {};
  st.visited=true;
  save();

  render(`
  <div class="exambar">
    <b>${esc(EXAMS[A.exam].name)}</b>
    <span>${esc(A.name)}</span>
    <span>Q ${A.current+1}/${A.ids.length}</span>
    <span id="timer" class="tm">--:--</span>
  </div>

  <div class="ex">
    <main class="card">
      <div class="meta">${esc(x.section)} · ${esc(x.subject)} · ${esc(x.topic)} · ${esc(x.difficulty)}</div>
      <h2 class="question">${esc(x.question)}</h2>

      <div class="options">
        ${A.perm[id].map((originalIndex,screenIndex)=>`
          <button class="opt ${A.answers[id]===originalIndex?"on":""}" data-a="pick" data-v="${originalIndex}">
            <b>${"ABCD"[screenIndex]}.</b><span>${esc(x.options[originalIndex])}</span>
          </button>`).join("")}
      </div>

      <div class="actions">
        <button class="btn" data-a="prev">Previous</button>
        <button class="btn pri" data-a="next">${A.current===A.ids.length-1?"Review & Submit":"Save & Next"}</button>
        <button class="btn" data-a="mark">${st.review?"Unmark Review":"Mark for Review"}</button>
        <button class="btn" data-a="clear">Clear Response</button>
        <button class="btn" data-a="bookmark">${P.bookmarks.includes(id)?"★ Bookmarked":"☆ Bookmark"}</button>
      </div>
    </main>

    <aside class="card palette">
      <details open>
        <summary>Question Palette</summary>
        <div class="pal">
          ${A.ids.map((z,i)=>`<button class="p ${paletteClass(z,i)}" data-a="jump" data-v="${i}">${i+1}</button>`).join("")}
        </div>
        <div class="legend">
          <span>Grey: not visited</span> ·
          <span>Red: not answered</span> ·
          <span>Green: answered</span> ·
          <span>Purple: review</span>
        </div>
      </details>
      <button class="btn danger full" data-a="submit">Submit Test</button>
    </aside>
  </div>`);

  startTimer();
}
function startTimer(){
  clearTimer();
  const tick=()=>{
    if(!P.active)return;
    const left=Math.max(0,P.active.end-Date.now());
    const total=Math.floor(left/1000);
    const h=Math.floor(total/3600);
    const m=Math.floor((total%3600)/60);
    const s=total%60;
    const el=document.getElementById("timer");
    if(el){
      el.textContent=(h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
      el.classList.toggle("warn",left<=10*60000&&left>5*60000);
      el.classList.toggle("crit",left<=5*60000);
    }
    if(left<=0){
      clearTimer();
      submitTest(true);
    }
  };
  tick();
  timer=setInterval(tick,500);
}

/* =========================================================
   RESULT / REVIEW
   ========================================================= */
function submitTest(auto=false){
  if(!P.active)return;
  if(!auto && !confirm("Submit this test? You will not be able to change your answers."))return;

  clearTimer();
  const A=P.active, cfg=A.score;
  let correct=0,wrong=0,unattempted=0;

  const details=A.ids.map(id=>{
    const x=getQ(id), selected=A.answers[id];
    let result="U";
    if(selected===undefined)unattempted++;
    else if(selected===x.correctAnswer){correct++;result="C";}
    else {wrong++;result="W";}
    if(selected!==undefined)record(id,result==="C");
    return {id,result,selected};
  });

  const score=correct*cfg.correct-wrong*cfg.negative;
  const max=A.ids.length*cfg.correct;
  const result={
    id:Date.now(),
    exam:A.exam,name:A.name,date:new Date().toISOString(),
    total:A.ids.length,correct,wrong,unattempted,
    score,max,percent:Math.round(Math.max(0,score)/max*100),
    details
  };
  P.history.push(result);
  P.active=null;
  save();
  resultView(result);
}
function resultView(r){
  render(`
  <section class="card hero">
    <span class="badge">TEST COMPLETED</span>
    <h2>${esc(EXAMS[r.exam].name)} · ${esc(r.name)}</h2>
    <div class="grid stats">
      ${stat("Final Score",r.score.toFixed(2))}
      ${stat("Accuracy",pct(r.correct,r.correct+r.wrong)+"%")}
      ${stat("Correct",r.correct)}
      ${stat("Wrong",r.wrong)}
      ${stat("Unattempted",r.unattempted)}
      ${stat("Percentage",r.percent+"%")}
    </div>
  </section>
  <section class="card">
    <h3>Question Review</h3>
    ${r.details.map((d,i)=>{
      const x=getQ(d.id);
      return `<details class="review ${d.result}">
        <summary>Q${i+1} · ${esc(x.subject)} · ${d.result==="C"?"Correct":d.result==="W"?"Wrong":"Unattempted"}</summary>
        <div class="rv">
          <p><b>${esc(x.question)}</b></p>
          <p>Your answer: <b>${d.selected===undefined?"Not answered":esc(x.options[d.selected])}</b></p>
          <p>Correct answer: <b>${esc(x.options[x.correctAnswer])}</b></p>
          <p>${esc(x.explanation)}</p>
          ${x.formula?`<p><b>Formula:</b> ${esc(x.formula)}</p>`:""}
          <button class="btn" data-a="practiceOne" data-id="${x.id}">Practice Again</button>
        </div>
      </details>`;
    }).join("")}
  </section>
  <div class="actions">
    <button class="btn pri" data-a="home">Dashboard</button>
    <button class="btn" data-a="wrong">Practice Mistakes</button>
    <button class="btn" data-a="performance">Performance</button>
  </div>`);
}

/* =========================================================
   PERFORMANCE / MISTAKES / BOOKMARKS
   ========================================================= */
function performance(){
  const s=overall(), topics=topicStats().sort((a,b)=>pct(a.c,a.a)-pct(b.c,b.a));
  render(`
  <section class="card"><h2>Performance Analytics</h2>
    <div class="grid stats">
      ${stat("Questions Solved",s.solved)}
      ${stat("Accuracy",s.accuracy+"%")}
      ${stat("Tests",s.tests)}
      ${stat("Best",s.best+"%")}
    </div>
  </section>
  <section class="card"><h3>Topic Performance</h3>
    ${topics.length?topics.map(t=>{
      const v=pct(t.c,t.a);
      return `<div class="row"><span>${esc(t.subject)}<small>${esc(t.topic)}</small></span>
        <div class="bar2"><i style="width:${v}%"></i></div><b>${v}%</b></div>`;
    }).join(""):"<p class='meta'>Complete some questions to build analytics.</p>"}
  </section>
  <section class="card"><h3>Test History</h3>
    ${P.history.length?P.history.slice().reverse().map((h,i)=>
      `<div class="history"><b>#${P.history.length-i} ${esc(h.name)}</b><span>${h.percent}% · ${h.correct}/${h.total} correct · ${new Date(h.date).toLocaleDateString()}</span></div>`
    ).join(""):"<p class='meta'>No tests completed yet.</p>"}
  </section>
  <button class="btn" data-a="home">Back</button>`);
}
function mistakes(mode="wrong"){
  const ids=Object.keys(P.attempts).filter(id=>{
    if(!getQ(id))return false;
    if(mode==="due")return due(id);
    if(mode==="mastered")return mastered(id);
    return P.attempts[id].wrong>0;
  });
  render(`
  <section class="card">
    <h2>${mode==="due"?"Revision Queue":mode==="mastered"?"Mastered Questions":"My Mistakes"}</h2>
    <p class="meta">${ids.length} question(s)</p>
    <button class="btn pri" data-a="${mode==="due"?"due":"wrong"}>${mode==="due"?"Start Revision":"Practice Mistakes"}</button>
    <button class="btn" data-a="home">Back</button>
  </section>
  <section class="card">
    ${ids.length?ids.map(id=>{
      const x=getQ(id),r=P.attempts[id];
      return `<div class="history">
        <div><b>${esc(x.subject)} · ${esc(x.topic)}</b><small>${esc(x.question)}</small></div>
        <span>Attempts ${r.attempts} · Wrong ${r.wrong} · Mastery ${r.mastery}% · Streak ${r.streak}</span>
      </div>`;
    }).join(""):"<p>No questions in this category.</p>"}
  </section>`);
}
function bookmarks(){
  const ids=P.bookmarks.filter(id=>getQ(id));
  render(`<section class="card"><h2>Bookmarks</h2><p class="meta">${ids.length} saved question(s)</p>
    <button class="btn pri" data-a="startBookmarks">Practice Bookmarks</button>
    <button class="btn" data-a="home">Back</button></section>
    <section class="card">${ids.length?ids.map(id=>{
      const x=getQ(id);
      return `<div class="history"><b>${esc(x.subject)} · ${esc(x.topic)}</b><small>${esc(x.question)}</small></div>`;
    }).join(""):"<p>No bookmarks yet.</p>"}</section>`);
}

/* =========================================================
   EVENT ROUTER
   ========================================================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");
  if(!el)return;
  const a=el.dataset.a;
  try{
    if(a==="home")home();
    else if(a==="resume")examView();
    else if(a==="discardActive"){
      if(confirm("Discard the unfinished test? Completed history will remain unchanged.")){
        P.active=null; save(); home();
      }
    }
    else if(a==="theme"){
      P.theme=P.theme==="dark"?"light":"dark";
      document.documentElement.dataset.theme=P.theme;
      save();
    }
    else if(a==="setup")setup(P.exam);
    else if(a==="preset")setup(el.dataset.exam);
    else if(a==="quick")startTest({exam:P.exam,count:10,difficulty:"Mixed",duration:15,mode:"normal",name:"Quick Practice"});
    else if(a==="wrong")startTest({exam:P.exam,count:10,difficulty:"Mixed",duration:15,mode:"wrong",name:"My Mistakes"});
    else if(a==="due")startTest({exam:P.exam,count:10,difficulty:"Mixed",duration:15,mode:"due",name:"Revision Test"});
    else if(a==="weak")startTest({exam:P.exam,count:10,difficulty:"Mixed",duration:15,mode:"weak",name:"Weak Topics"});
    else if(a==="bookmarks")bookmarks();
    else if(a==="startBookmarks")startTest({exam:P.exam,count:20,difficulty:"Mixed",duration:20,mode:"bookmarks",name:"Bookmarks"});
    else if(a==="performance")performance();
    else if(a==="startCustom")startCustom();
    else if(a==="pick"){
      const A=P.active,id=A.ids[A.current];
      A.answers[id]=Number(el.dataset.v); save(); examView();
    }
    else if(a==="next"){
      if(P.active.current===P.active.ids.length-1)submitTest(false);
      else {P.active.current++;save();examView();}
    }
    else if(a==="prev"){
      if(P.active.current>0){P.active.current--;save();examView();}
    }
    else if(a==="jump"){
      P.active.current=Number(el.dataset.v);save();examView();
    }
    else if(a==="mark"){
      const id=P.active.ids[P.active.current];
      P.active.state[id] ||= {};
      P.active.state[id].review=!P.active.state[id].review;
      save();examView();
    }
    else if(a==="clear"){
      const id=P.active.ids[P.active.current];
      delete P.active.answers[id];save();examView();
    }
    else if(a==="bookmark"){
      const id=P.active.ids[P.active.current];
      const i=P.bookmarks.indexOf(id);
      if(i<0)P.bookmarks.push(id);else P.bookmarks.splice(i,1);
      save();examView();
    }
    else if(a==="submit")submitTest(false);
    else if(a==="practiceOne")startTest({exam:P.exam,ids:[el.dataset.id],count:1,duration:5,name:"Practice Again"});
    else if(a==="export"){
      const blob=new Blob([JSON.stringify(P,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob),link=document.createElement("a");
      link.href=url;link.download="civil-je-cbt-progress.json";link.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    else if(a==="import")document.getElementById("importFile")?.click();
    else if(a==="reset"){
      if(confirm("Delete ALL saved progress, bookmarks and test history?")){
        localStorage.removeItem(STORE);P=loadState();home();
      }
    }
  }catch(err){errorScreen(err);}
});

document.addEventListener("change",e=>{
  if(e.target.id==="importFile" && e.target.files[0]){
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const imported=JSON.parse(reader.result);
        if(!imported || typeof imported!=="object" || !imported.attempts || !Array.isArray(imported.history))
          throw new Error("Invalid CBT progress file.");
        P={...structuredClone(defaultState),...imported,active:null};
        save();home();
        alert("Progress imported successfully.");
      }catch(err){alert("Import failed: "+err.message);}
    };
    reader.readAsText(e.target.files[0]);
  }
});

window.addEventListener("beforeunload",e=>{
  if(P.active){e.preventDefault();e.returnValue="";}
});

document.documentElement.dataset.theme=P.theme;

function boot(){
  if(P.active&&P.active.ids&&P.active.ids.length){
    const left=P.active.end-Date.now();
    if(left>0){
      render(`<section class="card hero">
        <div>
          <span class="badge">ACTIVE TEST FOUND</span>
          <h2>Resume your unfinished test?</h2>
          <p class="meta">${esc(P.active.name)} · ${esc(EXAMS[P.active.exam].name)} · ${P.active.current+1}/${P.active.ids.length} questions</p>
        </div>
        <div class="actions">
          <button class="btn pri" data-a="resume">Resume Test</button>
          <button class="btn danger" data-a="discardActive">Discard Test</button>
        </div>
      </section>`);
      return;
    }
    P.active=null; save();
  }
  home();
}
boot();

})();
</script>
